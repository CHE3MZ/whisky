name: Security Scan

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Mondays at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so trufflehog can compare base..head on PRs and
          # HEAD~1..HEAD on direct pushes.
          fetch-depth: 0

      - name: TruffleHog (PR diff)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.99.9
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown

      - name: TruffleHog (push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@v3.99.9
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --results=verified,unknown

      - name: TruffleHog (scheduled/manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@v3.99.9
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown

  lint:
    name: Lint scripts, workflows, and links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: actionlint
        uses: raven-actions/actionlint@v2

      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts

      - name: ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check
          src: .

      - name: ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check --diff
          src: .

      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --retry-wait-time 2 --exclude docs/site/overrides/ .
          fail: true

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install MkDocs
        run: python -m pip install mkdocs==1.6.1 mkdocs-material==9.8.1

      - name: Build documentation
        run: mkdocs build --strict

  osv-scanner:
    name: OSV scanner
    # Fork PRs get a read-only token, which cannot upload SARIF; run this on
    # pushes, the weekly schedule, and manual runs instead.
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        -r
        ./
      # report vulns instead of failing the workflow.
      fail-on-vuln: false

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  runtime-config:
    name: Runtime config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate sources.yml
        run: bash scripts/runtime.sh 9.9.9 --dry-run

  audit:
    name: Upstream audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Run audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f .planning/milestones/v1.0-REQUIREMENTS.md ]; then
            echo "::notice::.planning/milestones/v1.0-REQUIREMENTS.md is not committed; skipping upstream audit"
            exit 0
          fi
          python3 scripts/audit/audit_upstream.py --refresh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-report
          path: .planning/audit/AUDIT_REPORT.md
          if-no-files-found: ignore
