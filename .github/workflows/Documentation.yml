name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'WhiskyKit/**'
      - 'dist/pages/**'
      - '.github/workflows/Documentation.yml'
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

env:
  XCODE_VERSION: 'latest-stable'

jobs:
  build-docs:
    name: Build Documentation
    # macos-15, same as CI: latest-stable Xcode on macos-14 is a generation
    # older, and its SDK predates Sendable annotations the kit now relies on
    # (NSImage in IconCache), so the docs build fails where CI passes.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache SPM Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            .build
            WhiskyKit/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Documentation
        run: |
          cd WhiskyKit
          swift package --allow-writing-to-directory ../docs \
            generate-documentation \
            --target WhiskyKit \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path whisky \
            --output-path ../docs

      - name: Stage distribution files
        run: |
          if [ -d dist/pages ]; then
            cp -R dist/pages/. docs/
          fi
          ls -la docs/

      # The Sparkle feed is generated per release and attached to that release.
      # Keep the historical /appcast.xml URL alive by mirroring the newest app
      # release's asset at deploy time, without committing it to the repo.
      - name: Mirror latest app release appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f docs/appcast.xml

          TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name | select(startswith("app-v"))][0] // ""')"
          FEED_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/appcast.xml"

          if [ -n "$TAG" ] && gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern appcast.xml \
              --output docs/appcast.xml; then
            echo "Mirrored appcast.xml from release $TAG"
          elif curl -fsSL "$FEED_URL" --output docs/appcast.xml; then
            echo "::warning::Could not read the newest app release's appcast.xml; reusing $FEED_URL"
          elif [ -z "$TAG" ]; then
            echo "::warning::No app releases or deployed feed found; /appcast.xml will be absent"
          else
            echo "::error::Latest app release $TAG has no appcast.xml asset and no deployed feed to reuse"
            exit 1
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
