name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'WhiskyKit/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/docs.sh'
      - '.github/workflows/Documentation.yml'
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

env:
  XCODE_VERSION: 'latest-stable'

jobs:
  build-docs:
    name: Build Documentation
    # macos-15, same as CI: latest-stable Xcode on macos-14 is a generation
    # older, and its SDK predates Sendable annotations the kit now relies on
    # (NSImage in IconCache), so the docs build fails where CI passes.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache SPM Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            .build
            WhiskyKit/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install MkDocs
        run: python -m pip install mkdocs==1.6.1 mkdocs-material==9.8.1

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/docs.sh

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
