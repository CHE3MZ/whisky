name: Release

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing app release tag (app-vX.Y.Z)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ "$TAG" != app-v* ]]; then
            echo "::error::Expected an app-vX.Y.Z tag, got '$TAG'"
            exit 1
          fi
          VERSION="${TAG#app-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Invalid version '$VERSION' from tag '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install create-dmg
        run: |
          node --version
          npm install --global create-dmg
          create-dmg --help >/dev/null

      - name: Import signing certificates
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYCHAIN_PASSWORD DEVELOPER_ID_CERTIFICATE_P12 \
                      DEVELOPER_ID_CERTIFICATE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is not set"
              exit 1
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$DEVELOPER_ID_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security list-keychains -d user \
            | tr -d '"' \
            | xargs security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is not set"
              exit 1
            fi
          done
          TEAM_ID="${APPLE_TEAM_ID:-UYNK59NFK8}"
          xcrun notarytool store-credentials AC_PASSWORD \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build, sign, notarize, and package DMG
        env:
          ARCHIVE_CODE_SIGN_STYLE: Manual
          ARCHIVE_CODE_SIGN_IDENTITY: Developer ID Application
        run: scripts/release.sh "${{ steps.release.outputs.version }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          DMG="build/release/Whisky-${VERSION}.dmg"
          if [ ! -f "$DMG" ]; then
            echo "::error::$DMG not found"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$DMG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Whisky ${VERSION}" \
              --generate-notes
          fi