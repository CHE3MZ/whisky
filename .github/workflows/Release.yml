name: Release

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing app release tag (app-vX.Y.Z)'
        required: true

permissions:
  contents: write
  # Needed to dispatch the Homebrew tap job after publishing (GITHUB_TOKEN-created
  # release events do not trigger other workflows).
  actions: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ "$TAG" != app-v* ]]; then
            echo "::error::Expected an app-vX.Y.Z tag, got '$TAG'"
            exit 1
          fi
          VERSION="${TAG#app-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Invalid version '$VERSION' from tag '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The appcast is signed with the Sparkle Ed25519 key. Fail before the long
      # build rather than after it if the secret is missing.
      - name: Validate Sparkle signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set"
            exit 1
          fi

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install git-cliff
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install git-cliff

      # Same generator as `task cliff` (cliff.toml at the repo root), run before the
      # long build so a broken tag/config fails fast. `--unreleased` would be empty
      # here because the workflow runs on the tag itself, so scope the range to the
      # previous app release explicitly. Env lets git-cliff resolve PR titles and
      # authors through the API.
      - name: Generate release notes
        env:
          RUST_LOG: off
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'app-v*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            FIRST_RELEASE=0
          else
            # First app release: everything since the root commit.
            ROOT="$(git rev-list --max-parents=0 "$TAG" | sed -n '1p')"
            RANGE="${ROOT}..${TAG}"
            FIRST_RELEASE=1
          fi

          # The GitHub API lookup (PR titles/authors) is nice-to-have; a transient
          # failure must not block an already-built release. Fall back to the
          # offline renderer, which uses the raw commit messages.
          if ! git-cliff "$RANGE" --tag "$TAG" --tag-pattern '^app-v' \
              --strip all > release-notes.md; then
            echo "::warning::git-cliff could not fetch GitHub metadata; retrying offline"
            git-cliff "$RANGE" --tag "$TAG" --tag-pattern '^app-v' \
              --strip all --offline > release-notes.md
          fi

          # git-cliff resolves "previous" from the tag list even when the range has
          # no previous release, which would produce a bogus compare link.
          if [ "$FIRST_RELEASE" = "1" ]; then
            sed -i '' '/^\*\*Full Changelog\*\*:/d' release-notes.md
          fi

          if [ ! -s release-notes.md ]; then
            echo "::error::git-cliff produced empty release notes"
            exit 1
          fi
          cat release-notes.md

      - name: Install create-dmg
        run: |
          node --version
          npm install --global create-dmg
          create-dmg --help >/dev/null

      - name: Import signing certificates
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYCHAIN_PASSWORD DEVELOPER_ID_CERTIFICATE_P12 \
                      DEVELOPER_ID_CERTIFICATE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is not set"
              exit 1
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$DEVELOPER_ID_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security list-keychains -d user \
            | tr -d '"' \
            | xargs security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

      - name: Store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name secret is not set"
              exit 1
            fi
          done
          TEAM_ID="${APPLE_TEAM_ID:-UYNK59NFK8}"
          xcrun notarytool store-credentials AC_PASSWORD \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build, sign, notarize, and package DMG
        env:
          ARCHIVE_CODE_SIGN_STYLE: Manual
          ARCHIVE_CODE_SIGN_IDENTITY: Developer ID Application
        run: bash scripts/release.sh "${{ steps.release.outputs.version }}"

      # Sign the exact DMG that will be published and generate the appcast entry.
      # The feed itself is a release asset; Documentation.yml mirrors the newest
      # app release's copy to GitHub Pages so existing installs keep updating.
      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/appcast.sh \
            --version "$VERSION" \
            --build "$(cat build/release/build-number.txt)" \
            --dmg "build/release/Whisky-${VERSION}.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --output build/release/appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          DMG="build/release/Whisky-${VERSION}.dmg"
          APPCAST="build/release/appcast.xml"
          for asset in "$DMG" "$APPCAST"; do
            if [ ! -f "$asset" ]; then
              echo "::error::$asset not found"
              exit 1
            fi
          done

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run: refresh both assets before making sure the release is live.
            gh release upload "$TAG" "$DMG" "$APPCAST" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --notes-file release-notes.md \
              --draft=false \
              --repo "$GITHUB_REPOSITORY"
          else
            # Create as a draft so the Pages mirror never reads a release that
            # is missing its DMG or appcast.
            gh release create "$TAG" "$DMG" "$APPCAST" \
              --draft \
              --repo "$GITHUB_REPOSITORY" \
              --title "Whisky ${VERSION}" \
              --notes-file release-notes.md
            gh release edit "$TAG" \
              --draft=false \
              --repo "$GITHUB_REPOSITORY"
          fi

      # Events created with GITHUB_TOKEN do not trigger other workflows
      # (workflow_dispatch is the documented exception), so the release above
      # would otherwise never reach UpdateHomebrewTap's `release: published`
      # trigger, and the Pages mirror would not refresh. Dispatch both
      # explicitly; both workflows are idempotent.
      - name: Trigger Pages appcast mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run Documentation.yml --repo "$GITHUB_REPOSITORY"

      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run UpdateHomebrewTap.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
