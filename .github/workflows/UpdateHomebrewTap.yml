name: Update Homebrew Tap

# When an app release (app-vX.Y.Z) is published, bump the CHE3MZ/homebrew-tools
# cask to the new version + DMG sha256 so `brew install --cask CHE3MZ/tools/whisky`
# always tracks the latest release without a manual edit.
#
# Requires a repository secret BREW_TOKEN: a personal access token (classic `repo`,
# or fine-grained with Contents: write) for CHE3MZ/homebrew-tools. The default
# GITHUB_TOKEN cannot push to a different repository.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: App release tag to sync (e.g. app-v3.1.0)
        required: true

permissions:
  contents: read

jobs:
  update-tap:
    # Only app releases; the Wine Libraries stream uses bare vX.Y.Z tags and has no cask.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'app-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Bump cask to the released version
        env:
          BREW_TOKEN: ${{ secrets.BREW_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${BREW_TOKEN:-}" ]; then
            echo "::error::BREW_TOKEN secret is not set. Add a PAT with Contents:write for CHE3MZ/homebrew-tools."
            exit 1
          fi
          echo "::add-mask::${BREW_TOKEN}"

          if [[ "$TAG" != app-v* ]]; then
            echo "::error::Refusing to sync: '${TAG}' is not an app release tag (expected app-vX.Y.Z)."
            exit 1
          fi
          version="${TAG#app-v}"
          # Strictly validate the version before it flows into URLs and the sed
          # expressions below — refuse anything that isn't a dotted numeric version.
          if ! printf '%s' "$version" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::Refusing to sync: '${version}' (from tag '${TAG}') is not a dotted numeric version."
            exit 1
          fi
          url="https://github.com/CHE3MZ/whisky/releases/download/${TAG}/Whisky-${version}.dmg"
          echo "Syncing tap to ${version} from ${url}"

          curl -fSL "$url" -o whisky.dmg
          sha="$(sha256sum whisky.dmg | awk '{print $1}')"
          echo "sha256=${sha}"

          git clone --depth 1 "https://x-access-token:${BREW_TOKEN}@github.com/CHE3MZ/homebrew-tools.git" tap
          cd tap
          mkdir -p Casks
          if [ ! -f Casks/whisky.rb ]; then
            cat > Casks/whisky.rb <<EOF
          cask "whisky" do
            version "${version}"
            sha256 "${sha}"

            url "https://github.com/CHE3MZ/whisky/releases/download/app-v#{version}/Whisky-#{version}.dmg"
            name "Whisky"
            desc "Run Windows games and applications on macOS"
            homepage "https://github.com/CHE3MZ/whisky"

            livecheck do
              url "https://che3mz.github.io/whisky/appcast.xml"
              strategy :sparkle, &:short_version
            end

            auto_updates true
            conflicts_with cask: "whisky"

            depends_on arch: :arm64
            depends_on macos: :sequoia

            app "Whisky.app"
            binary "#{appdir}/Whisky.app/Contents/Resources/WhiskyCmd", target: "whisky"

            uninstall quit: "com.che3mz.whisky"
          end
          EOF
          else
            sed -i -E "s/version \"[^\"]+\"/version \"${version}\"/" Casks/whisky.rb
            sed -i -E "s/sha256 \"[0-9a-f]{64}\"/sha256 \"${sha}\"/" Casks/whisky.rb
            # Older casks used the bare runtime-style v tag; rewrite it to app-v.
            sed -i -E 's#releases/download/v#releases/download/app-v#' Casks/whisky.rb
          fi

          # `sed -i` exits 0 even when it matches nothing, so assert both edits
          # actually landed. Otherwise a partial match (e.g. the existing sha256
          # line not being 64-lowercase-hex) could push a cask carrying the new
          # version with a stale hash — silently breaking `brew install` for
          # every user while the workflow stays green.
          grep -qF "version \"${version}\"" Casks/whisky.rb \
            || { echo "::error::version line was not updated in Casks/whisky.rb"; exit 1; }
          grep -qF "sha256 \"${sha}\"" Casks/whisky.rb \
            || { echo "::error::sha256 line was not updated (existing line not 64-lowercase-hex?)"; exit 1; }
          grep -qF "releases/download/app-v#{version}" Casks/whisky.rb \
            || { echo "::error::url line does not use the app-v tag scheme in Casks/whisky.rb"; exit 1; }

          if command -v ruby >/dev/null 2>&1; then
            ruby -c Casks/whisky.rb >/dev/null \
              || { echo "::error::Casks/whisky.rb is not valid Ruby"; exit 1; }
          fi

          git add Casks/whisky.rb
          if git diff --cached --quiet; then
            echo "Cask already at ${version}; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "whisky ${version}"
          git push
          echo "Tap updated to whisky ${version}."
