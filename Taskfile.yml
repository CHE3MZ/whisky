version: '3'

env:
  RUST_LOG: off

tasks:
  default:
    desc: Default Task
    silent: true
    cmds:
      - task --list
  cliff:
    desc: Run git cliff
    silent: true
    cmds:
      - git-cliff --unreleased --strip all
  changelog:
    desc: Generate changelog
    silent: true
    cmds:
      - git-cliff --strip all -o docs/CHANGELOG.md
  check-links:
    desc: Lint links.
    cmds:
      - cmd: lychee .
  scan:
    desc: Run other ops tools on the repo.
    cmds:
      - cmd: opengrep scan
      - cmd: osv-scanner scan .
      - cmd: gitleaks git . --no-banner
      - cmd: scorecard --local . --format json | gron
