version: '3'

env:
  RUST_LOG: off

tasks:
  default:
    desc: Default Task
    silent: true
    cmds:
      - task --list
  ops:
    desc: Run all ops tasks
    ignore_error: true
    cmds:
      - task lint
      - task format
      - task secrets
      - task scan
      - task checks
  build:
    desc: Build the app
    cmds:
      - bash scripts/build.sh {{.CLI_ARGS}}
  build-full:
    desc: Build all schemes
    cmds:
      - bash scripts/build.sh --full {{.CLI_ARGS}}
  clean:
    desc: Remove build artifacts and caches
    cmds:
      - cmd: bash scripts/clean.sh {{.CLI_ARGS}}
      - cmd: uvx ruff clean
  release:
    desc: Perform a release build
    cmds:
      - bash scripts/release.sh {{.CLI_ARGS}}
  runtime:
    desc: Assemble the runtime
    cmds:
      - bash scripts/runtime.sh {{.CLI_ARGS}}
  docs:
    desc: Build the documentation site
    cmds:
      - bash scripts/docs.sh {{.CLI_ARGS}}
  lint:
    desc: Lint Swift sources
    cmds:
      - cmd: swiftlint --strict
  format:
    desc: Format Swift sources
    cmds:
      - cmd: swiftformat .
  test:
    desc: Build and run tests
    cmds:
      - bash scripts/tests/test.sh
  audit:
    desc: Run the audit scripts
    cmds:
      - bash scripts/audit/audit.sh
  upstream:
    desc: Run upstream checks
    cmds:
      - cmd: sh scripts/upstream/track.sh
      - cmd: sh scripts/upstream/report.sh
  sync:
    desc: Run sync operations
    cmds:
      - task: upstream
  cliff:
    desc: Run git cliff
    silent: true
    cmds:
      - git-cliff --unreleased --strip all
  changelog:
    desc: Generate changelog
    silent: true
    cmds:
      - git-cliff --strip all -o docs/misc/changelog.md
  check-links:
    desc: Lint links
    cmds:
      - cmd: lychee .
  check-scripts:
    desc: Lint scripts
    ignore_error: true
    cmds:
      - cmd: find scripts -type f -name '*.sh' -exec shellcheck {} +
      - cmd: uvx ruff check . --no-cache
      - cmd: uvx ruff format . --check --no-cache
  checks:
    desc: Run all checks
    ignore_error: true
    cmds:
      - task: check-links
      - task: check-scripts
  secrets:
    desc: Run secret scans
    ignore_error: true
    cmds:
      - cmd: trufflehog git file://. --results=verified,unknown --fail
      - cmd: gitleaks git . --no-banner --verbose
      - cmd: betterleaks git . --no-banner --verbose
  scan:
    desc: Run other ops tools on the repo
    ignore_error: true
    cmds:
      - cmd: opengrep scan
      - cmd: osv-scanner scan source --recursive .
      - cmd: gitleaks git . --no-banner --verbose
      - cmd: actionlint --verbose
      - cmd: find scripts -type f -name '*.sh' -exec shellcheck {} +
      - cmd: scorecard --local . --format json | gron
